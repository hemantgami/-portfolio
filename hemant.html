    .star-icon {
      display: inline-block;

      background-color: #f0efea;
    }
    .polaroid-shadow {
      box-shadow: 2px 4px 16px rgba(0,0,0,0.5);
    }
    .contact-badge {
      transition: all 0.2s ease;
    }
    .contact-badge:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }
    @media (max-width: 640px) {
      .portfolio-title {
        font-size: 48px !important;

    }

</head>

    gsap.fromTo(".main-portfolio", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" });
    gsap.fromTo("#profileRow > div", { y: 20, opacity: 0 }, { y: 0, opacity: 1, stagger: 0.1, duration: 0.6, delay: 0.2 });
    gsap.fromTo("#expEduRow", { y: 25, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, delay: 0.4 });
  }
  
  // Run after page load
  window.addEventListener("DOMContentLoaded", () => {
    renderPortfolio();
  });
</script>
